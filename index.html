<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BLNK Display</title>
    
    <!-- GitHub Pages SPA Routing -->
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // MIT License
      // https://github.com/rafgraph/spa-github-pages
      (function(l) {
        if (l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) { 
            return s.replace(/~and~/g, '&')
          }).join('?');
          window.history.replaceState(null, null,
              l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location))
    </script>
    
    <!-- Theme Runtime - Prevents flash of wrong theme color -->
    <script>
      (function() {
        'use strict';
        
        var THEME_STORAGE_KEY = 'blnk-accent-color';
        var DEFAULT_ACCENT_COLOR = '#00E5FF';

        var COLOR_PRESETS = {
          '#00E5FF': { hsl: '186 100% 50%', dark: '#00B8CC', light: '#80F2FF' },
          '#007CF0': { hsl: '209 100% 47%', dark: '#005FC0', light: '#60AEFF' },
          '#7B61FF': { hsl: '250 100% 69%', dark: '#5C3FDF', light: '#B3A3FF' },
          '#00FF88': { hsl: '152 100% 50%', dark: '#00CC6D', light: '#66FFB3' },
        };
        
        function hexToHsl(hex) {
          hex = hex.replace('#', '');
          var r = parseInt(hex.substring(0, 2), 16) / 255;
          var g = parseInt(hex.substring(2, 4), 16) / 255;
          var b = parseInt(hex.substring(4, 6), 16) / 255;
          
          var max = Math.max(r, g, b);
          var min = Math.min(r, g, b);
          var h = 0, s = 0;
          var l = (max + min) / 2;
          
          if (max !== min) {
            var d = max - min;
            s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
            switch (max) {
              case r: h = (g - b) / d + (g < b ? 6 : 0); break;
              case g: h = (b - r) / d + 2; break;
              case b: h = (r - g) / d + 4; break;
            }
            h /= 6;
          }
          
          return Math.round(h * 360) + ' ' + Math.round(s * 100) + '% ' + Math.round(l * 100) + '%';
        }
        
        try {
          var savedColor = localStorage.getItem(THEME_STORAGE_KEY);
          var accentColor = savedColor || DEFAULT_ACCENT_COLOR;
          var preset = COLOR_PRESETS[accentColor.toUpperCase()] || COLOR_PRESETS[accentColor.toLowerCase()];
          
          var root = document.documentElement;
          
          root.style.setProperty('--pink', accentColor);
          root.style.setProperty('--accent', accentColor);
          
          if (preset) {
            root.style.setProperty('--accent-dark', preset.dark);
            root.style.setProperty('--accent-light', preset.light);
            root.style.setProperty('--primary', preset.hsl);
            root.style.setProperty('--ring', preset.hsl);
          } else {
            root.style.setProperty('--accent-dark', accentColor);
            root.style.setProperty('--accent-light', accentColor);
            var hsl = hexToHsl(accentColor);
            root.style.setProperty('--primary', hsl);
            root.style.setProperty('--ring', hsl);
          }
        } catch (e) {
          // Silently fail - app will use default CSS values
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
